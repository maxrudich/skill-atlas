екта или большой фичи. Пишет planning/profile.md", "cat": "plan", "for": ["idea", "expo", "web", "bot"], "kw": "начать старт новый проект профиль kickoff", "eg": "/1-start для нового бота", "origin": "мой набор"}, {"id": "skill:2-scope", "kind": "skill", "name": "2-scope", "description": "Find or sharpen a project idea and write the scope doc. A focused flipped-interaction interview that pulls the idea out of the user's head, then cuts it down to a coherent first version. Run after 1-start. Writes planning/scope.md.", "ru": "Интервью, которое вытаскивает идею и урезает её до цельной первой версии", "when": "После 1-start, когда идея ещё размыта. Пишет scope.md", "cat": "plan", "for": ["idea"], "kw": "идея скоуп scope mvp урезать интервью", "eg": "/2-scope", "origin": "мой набор"}, {"id": "skill:3-prd", "kind": "skill", "name": "3-prd", "description": "Turn the approved scope into a complete product definition: the core journey, every behavior, states and edge cases, and a firm first-version boundary. No code talk. Run after 2-scope. Writes planning/prd.md.", "ru": "Полное описание продукта без кода: сценарии, состояния, границы версии 1", "when": "Когда скоуп утверждён, а код писать рано. Пишет prd.md", "cat": "plan", "for": ["idea"], "kw": "prd требования сценарии состояния продукт", "eg": "/3-prd", "origin": "мой набор"}, {"id": "skill:4-spec", "kind": "skill", "name": "4-spec", "description": "Turn the approved PRD into a technical blueprint the build can follow (stack, where it runs, components, data, file structure), calibrated to the user and sized to a small first version. The last planning step before code. Run after 3-prd. Writes planning/spec.md.", "ru": "Технический чертёж: стек, где живёт, данные, компоненты, файлы", "when": "Последний шаг планирования перед кодом. Пишет spec.md", "cat": "plan", "for": ["idea"], "kw": "архитектура спецификация стек схема", "eg": "/4-spec", "origin": "мой набор"}, {"id": "skill:5-build", "kind": "skill", "name": "5-build", "description": "Turn the approved plan into ordered working build steps, then build the project step by step, verifying and committing each one, in learn mode or fast mode. Use after 4-spec, and again whenever a build session was interrupted. Reads and writes planning/checklist.md.", "ru": "Собирает проект по шагам: каждый шаг проверяется и коммитится", "when": "Когда план готов. Если сессия оборвалась, запустите снова и он продолжит. Режимы learn и fast", "cat": "plan", "for": ["idea", "expo", "web", "bot"], "kw": "собрать билд строить реализовать чеклист", "eg": "Прервались на шаге 5-build, продолжи", "origin": "мой набор"}, {"id": "skill:6-ship", "kind": "skill", "name": "6-ship", "description": "Finish a project after 5-build. Verify it works, make the repository clean and safe, write run instructions, and optionally publish or deploy it. Run after 5-build, its final review and wrap-up are complete.", "ru": "Финиш проекта: проверка, чистый безопасный репозиторий, инструкция запуска, деплой", "when": "После 5-build. Это про порядок в репозитории, не про отправку в сторы", "cat": "plan", "for": ["idea", "release"], "kw": "релиз финиш деплой readme репозиторий", "vs": "Отправка в App Store и Google Play — eas-app-stores", "eg": "/6-ship", "origin": "мой набор"}, {"id": "skill:absolute-audit", "kind": "skill", "name": "absolute-audit", "description": "Vulnerability and security scan (defensive, your own repo): dependency CVEs plus risky code patterns (secrets, injection, weak authz), severity x reachability triaged and remediated without suppressing. Complements the built-in /security-review. Triggers on \"absolute audit\", \"security audit\", \"are we vulnerable\", \"scan for CVEs\", \"check for secrets/injection\", \"harden this\".", "ru": "Поиск уязвимостей в своём репозитории: CVE зависимостей, секреты, инъекции, слабая авторизация", "when": "Перед релизом или после крупных изменений", "cat": "quality", "for": ["bot", "web", "expo", "release"], "kw": "безопасность уязвимости cve секреты инъекции аудит security", "vs": "Чужой скилл до установки — skill-security-auditor. Быстрый — /security-review", "eg": "/absolute-audit на мой бот", "origin": "мой набор"}, {"id": "skill:ad-copywriter", "kind": "skill", "name": "ad-copywriter", "description": "广告创意写作与优化技能，覆盖标题、描述、正文及完整广告方案的生成与迭代，适用于Google Ads、Meta、LinkedIn、TikTok、Twitter/X等主流付费广告平台。当用户需要撰写广告文案、进行创意生成、标题撰写，或请求批量生产广告变体、基于数据进行创意测试与效果优化时触发。", "ru": "Заголовки, описания и целые рекламные кампании для Google, Meta, LinkedIn, TikTok, X", "when": "Нужны варианты объявлений для A/B или оптимизация по данным", "cat": "marketing", "for": ["release"], "kw": "реклама объявления копирайт заголовки ads a/b креатив", "origin": "мой набор"}, {"id": "skill:app-store-optimization", "kind": "skill", "name": "app-store-optimization", "description": "App Store Optimization (ASO) toolkit for researching keywords, analyzing competitor rankings, generating metadata suggestions, and improving app visibility on Apple App Store and Google Play Store. Use when the user asks about ASO, app store rankings, app metadata, app titles and descriptions, app store listings, app visibility, or mobile app marketing on iOS or Android. Supports keyword research and scoring, competitor keyword analysis, metadata optimization, A/B test planning, launch checklists, and tracking ranking changes.", "ru": "ASO: ключевые слова, заголовок, описание и листинг для App Store и Google Play", "when": "Готовите карточку приложения в сторах", "cat": "marketing", "for": ["release", "expo"], "kw": "aso ключевые слова листинг описание сторы метаданные", "vs": "Проверка на отказ при модерации — агент store-reviewer", "origin": "мой набор"}, {"id": "skill:apple-design", "kind": "skill", "name": "apple-design", "description": "Apple's approach to interface design and fluid, physical motion, translated for the web and React Native. Use when building or reviewing gesture-driven UI, spring animations, drag/swipe/sheet interactions, momentum and interruptible transitions, translucent materials and depth, typography (optical sizing, tracking, leading), reduced-motion, or the design foundations (feedback, spatial consistency, restraint) behind Apple-style interfaces.", "ru": "Как Apple делает интерфейсы: пружины, жесты, инерция, прерываемость, материалы, типографика", "when": "Строите или проверяете жесты и плавность. Основа для «аудита плавности». Работает для веба и React Native", "cat": "design", "for": ["expo", "web"], "kw": "плавность аудит анимации жесты spring инерция материалы типографика reduced motion apple wwdc", "vs": "Аудит по HIG — apple-hig-expert. Ревью кода анимаций — review-animations", "eg": "Сделай аудит плавности Apple для моего приложения", "origin": "Emil Kowalski (адаптирован: без рамок, с React Native)"}, {"id": "skill:apple-hig-expert", "kind": "skill", "name": "apple-hig-expert", "description": "Audits and designs iOS/macOS/watchOS/visionOS interfaces against the Apple Human Interface Guidelines, including the Liquid Glass design language (announced WWDC25, shipped with iOS 26/macOS Tahoe, Sept 2025). Use when reviewing an Apple-platform mockup or app for HIG compliance, checking contrast or tap-target sizes, or designing native-feeling Apple UI (e.g., 'audit my iOS app against the HIG', 'is this text readable on Liquid Glass?').", "ru": "Аудит и дизайн по Human Interface Guidelines, включая Liquid Glass", "when": "Проверить экран на контраст, размеры касаний и нативность по Apple", "cat": "design", "for": ["expo", "web"], "kw": "hig liquid glass контраст тап таргет ios macos нативный аудит", "vs": "Полная переделка со скриншотами — агент apple-native-designer", "eg": "/apple-hig-expert проверь экран настроек", "origin": "мой набор"}, {"id": "skill:break-ui", "kind": "skill", "name": "break-ui", "description": "Try to break a piece of UI by feeding it worst-case data — long names, unbreakable emails, one-letter names, missing fields, huge counts, zero items, long labels, non-Latin text, emoji, extreme numbers — then render it behind a \"Demo data / Worst case\" toggle and report everything that broke, with the fix for each. Use when the user asks to stress-test, break, or find edge cases in a component or screen, or to \"try the worst case\". For visual design critique use apple-design; for motion use review-animations.", "ru": "Ломает интерфейс худшими данными: длинные имена, пустые списки, огромные числа, эмодзи", "when": "Экран готов и красив на демо-данных. Покажет, что рухнет на реальных", "cat": "quality", "for": ["expo", "web"], "kw": "edge cases длинный текст пустой список переполнение стресс тест интерфейса worst case", "eg": "break-ui на экран транзакций в моём приложении", "origin": "Emil Kowalski"}, {"id": "skill:cfo-advisor", "kind": "skill", "name": "cfo-advisor", "description": "Financial leadership for startups and scaling companies. Financial modeling, unit economics, fundraising strategy, cash management, and board financial packages. Use when building financial models, analyzing unit economics, planning fundraising, managing cash runway, preparing board materials, or when user mentions CFO, burn rate, runway, fundraising, unit economics, LTV, CAC, term sheets, or financial strategy.", "ru": "Финмодель, юнит-экономика, runway, фандрейзинг", "when": "Хватит ли денег, окупается ли привлечение, сколько просить", "cat": "biz", "for": ["biz"], "kw": "финансы деньги runway юнит экономика ltv cac бюджет инвестиции", "eg": "cfo-advisor: хватит ли денег на 8 месяцев", "origin": "мой набор"}, {"id": "skill:cmo-advisor", "kind": "skill", "name": "cmo-advisor", "description": "Marketing leadership for scaling companies. Brand positioning, growth model design, marketing budget allocation, and marketing org design. Use when designing brand strategy, selecting growth models (PLG vs sales-led vs community-led), allocating marketing budgets, building marketing teams, or when user mentions CMO, brand strategy, growth model, CAC, LTV, channel mix, or marketing ROI.", "ru": "Бренд, модель роста, бюджет на маркетинг, команда", "when": "Выбираете канал роста или распределяете маркетинговый бюджет", "cat": "biz", "for": ["biz"], "kw": "бренд рост каналы маркетинг бюджет cmo", "origin": "мой набор"}, {"id": "skill:code-to-prd", "kind": "skill", "name": "code-to-prd", "description": "Reverse-engineer any codebase into a complete Product Requirements Document (PRD). Analyzes routes, components, state management, API integrations, and user interactions to produce business-readable documentation detailed enough for engineers or AI agents to fully reconstruct every page and endpoint. Works with frontend frameworks (React, Vue, Angular, Svelte, Next.js, Nuxt), backend frameworks (NestJS, Django, Express, FastAPI), and fullstack applications. Use when users mention: generate PRD, reverse-engineer requirements, code to documentation, extract product specs from code, document page logic, analyze page fields and interactions, create a functional inventory, write requirements from an existing codebase, document API endpoints, or analyze backend routes.", "ru": "Из готового кода делает PRD: экраны, маршруты, поля, API", "when": "Старый проект без документации или нужно описать, что приложение уже умеет", "cat": "plan", "for": ["bot", "web", "expo"], "kw": "reverse engineer документация из кода требования", "eg": "code-to-prd на мой бот", "origin": "мой набор"}, {"id": "skill:competitive-intel", "kind": "skill", "name": "competitive-intel", "description": "Systematic competitor tracking that feeds CMO positioning, CRO battlecards, and CPO roadmap decisions. Use when analyzing competitors, building sales battlecards, tracking market moves, positioning against alternatives, or when user mentions competitive intelligence, competitive analysis, competitor research, battlecards, win/loss, or market positioning.", "ru": "Систематическое отслеживание конкурентов: батлкарты, позиционирование, влияние на роадмап", "when": const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const byId = Object.fromEntries(D.items.map((i) => [i.id, i]));
const catById = Object.fromEntries(D.categories.map((c, n) => [c.id, { ...c, h: [215, 265, 330, 150, 35, 12, 190, 290, 220][n % 9] }]));
const stackById = Object.fromEntries(D.stacks.map((s) => [s.id, s]));
const KIND = { skill: "скилл", agent: "агент", command: "команда" };
const TABS = [["catalog", "Каталог"], ["order", "Порядок"], ["pick", "Какой выбрать"]];
const KINDS = [["all", "Всё"], ["skill", "Скиллы"], ["agent", "Агенты"], ["command", "Команды"]];

let S = { tab: "catalog", q: "", kind: "all", stack: "", cat: "", item: "" };

/* состояние в адресе: можно скинуть ссылку или нажать «назад» */
function readHash() {
  const p = new URLSearchParams(location.hash.slice(1));
  S = { tab: p.get("tab") || "catalog", q: p.get("q") || "", kind: p.get("kind") || "all", stack: p.get("stack") || "", cat: p.get("cat") || "", item: p.get("item") || "" };
}
function writeHash(push) {
  const p = new URLSearchParams();
  for (const k of ["tab", "q", "kind", "stack", "cat", "item"]) if (S[k] && !(k === "tab" && S[k] === "catalog") && !(k === "kind" && S[k] === "all")) p.set(k, S[k]);
  const h = p.toString() ? "#" + p.toString() : location.pathname + location.search;
  try { push ? history.pushState(null, "", h) : history.replaceState(null, "", h); } catch (e) {}
}
function set(patch, push) { Object.assign(S, patch); writeHash(push); render(); }

/* поиск: слова по частям, простое обрезание окончаний, веса по полям */
const norm = (s) => String(s || "").toLowerCase().replace(/ё/g, "е");
const stem = (t) => (t.length > 6 ? t.slice(0, -2) : t.length > 4 ? t.slice(0, -1) : t);
D.items.forEach((i) => {
  i._name = norm(i.name);
  i._kw = norm(i.kw);
  i._ru = norm(i.ru);
  i._when = norm(i.when + " " + (i.vs || "") + " " + (i.eg || ""));
  i._desc = norm(i.description);
  i._meta = norm(catById[i.cat].name + " " + (i.for || []).map((s) => stackById[s].name).join(" ") + " " + KIND[i.kind]);
});
function score(i, tokens) {
  let total = 0;
  for (const t of tokens) {
    const s = stem(t);
    let sc = 0;
    if (i._name.startsWith(s)) sc += 16; else if (i._name.includes(s)) sc += 10;
    if (i._kw.includes(s)) sc += 6;
    if (i._ru.includes(s)) sc += 5;
    if (i._when.includes(s)) sc += 3;
    if (i._meta.includes(s)) sc += 2;
    if (i._desc.includes(s)) sc += 1;
    if (!sc) return 0;
    total += sc;
  }
  return total;
}
function filtered() {
  const tokens = norm(S.q).split(/[^\p{L}\p{N}/:+-]+/u).filter(Boolean).map((t) => t.replace(/^\//, "")).filter(Boolean);
  let list = D.items.filter((i) => (S.kind === "all" || i.kind === S.kind) && (!S.cat || i.cat === S.cat) && (!S.stack || !(i.for || []).length || i.for.includes(S.stack)));
  if (tokens.length) {
    list = list.map((i) => [i, score(i, tokens)]).filter((x) => x[1] > 0).sort((a, b) => b[1] - a[1] || a[0].name.localeCompare(b[0].name)).map((x) => x[0]);
  }
  return { list, searching: tokens.length > 0 };
}

const inv = (i) => (i.kind === "agent" ? "агент " + i.name : "/" + i.name);
const label = (i) => (i.kind === "agent" ? i.name : "/" + i.name);
const copyText = (i) => (i.kind === "agent" ? `Используй агента ${i.name} на ` : "/" + i.name);

function card(i) {
  const c = catById[i.cat];
  return `<button class="card" data-open="${esc(i.id)}">
    <div class="card-top"><span class="dot" style="--h:${c.h}"></span><span class="name">${esc(label(i))}</span><span class="tag ${i.kind}">${esc(KIND[i.kind])}${i.kind === "agent" && i.model ? " · " + esc(i.model) : ""}</span></div>
    <div class="ru">${esc(i.ru)}</div>
    <div class="when">${esc(i.when)}</div>
  </button>`;
}

function viewCatalog() {
  const { list, searching } = filtered();
  let html = "";
  if (S.stack && !searching) {
    const pbs = D.playbooks.filter((p) => p.for.includes(S.stack));
    if (pbs.length) {
      html += `<div class="banner"><h3>${esc(stackById[S.stack].name)}</h3><p>Готовые порядки действий для этого случая:</p><div class="chips">${pbs.map((p) => `<button class="chip" data-pb="${esc(p.id)}">${esc(p.name)}</button>`).join("")}</div></div>`;
    }
  }
  if (!list.length) {
    return html + `<div class="empty"><b>Ничего не нашлось</b>Попробуйте другое слово или сбросьте фильтры.<br><button data-reset>Сбросить всё</button></div>`;
  }
  if (searching) {
    return html + `<div class="grid">${list.map(card).join("")}</div>`;
  }
  for (const c of D.categories) {
    const items = list.filter((i) => i.cat === c.id);
    if (!items.length) continue;
    html += `<section class="sec"><div class="sec-h"><h2>${esc(c.name)}</h2><span>${esc(c.hint)}</span></div><div class="grid">${items.map(card).join("")}</div></section>`;
  }
  return html;
}

function stepBtn(st, n) {
  const i = byId[st.ref];
  return `<button class="step" data-open="${esc(i.id)}"><span class="num">${n}</span><span><span class="name">${esc(label(i))}</span> <span class="tag ${i.kind}">${esc(KIND[i.kind])}</span><br><span class="why">${esc(st.why)}</span></span></button>`;
}
function viewOrder() {
  let pbs = D.playbooks;
  if (S.stack) pbs = pbs.filter((p) => p.for.includes(S.stack) || !p.for.length);
  if (S.q) {
    const t = norm(S.q);
    const hit = pbs.filter((p) => norm(p.name + " " + p.lead + " " + p.steps.map((s) => s.ref + s.why).join(" ")).includes(t));
    if (hit.length) pbs = hit;
  }
  if (!pbs.length) return `<div class="empty"><b>Для этого случая порядков пока нет</b><button data-reset>Показать все</button></div>`;
  return pbs.map((p) => `<section class="pb" id="pb-${esc(p.id)}"><h3>${esc(p.name)}</h3><p class="lead">${esc(p.lead)}</p><div class="pb-tags">${p.for.map((s) => `<span class="tag">${esc(stackById[s].name)}</span>`).join("")}</div>${p.steps.map((st, n) => stepBtn(st, n + 1)).join("")}</section>`).join("");
}

function viewPick() {
  let html = D.compare.map((g) => `<section class="cmp"><h3>${esc(g.name)}</h3><p class="lead">${esc(g.lead)}</p>${g.rows.map((r) => { const i = byId[r.ref]; return `<button class="opt" data-open="${esc(i.id)}"><span class="if">${esc(r.if)}</span><span class="to">${esc(label(i))}</span></button>`; }).join("")}</section>`).join("");
  return html;
}

function sheetHtml(i) {
  const c = catById[i.cat];
  const inPb = D.playbooks.filter((p) => p.steps.some((s) => s.ref === i.id));
  const inCmp = D.compare.filter((g) => g.rows.some((r) => r.ref === i.id));
  const same = D.items.filter((x) => x.cat === i.cat && x.id !== i.id).slice(0, 8);
  const eg = i.eg ? `<h4>Пример</h4><button class="copy" data-copy="${esc(i.eg)}"><code>${esc(i.eg)}</code><span>Копировать</span></button>` : "";
  return `<div class="kicker"><span class="dot" style="--h:${c.h}"></span>${esc(c.name)} · ${esc(KIND[i.kind])}${i.kind === "agent" && i.model ? " · " + esc(i.model) : ""}</div>
  <h2 id="sheet-title" class="mono" style="font-size:24px">${esc(label(i))}</h2>
  <p class="lede">${esc(i.ru)}</p>
  <h4>Когда звать</h4><p>${esc(i.when)}</p>
  ${i.vs ? `<h4>Не путать</h4><p>${esc(i.vs)}</p>` : ""}
  <h4>Как вызвать</h4><button class="copy" data-copy="${esc(copyText(i))}"><code>${esc(copyText(i))}</code><span>Копировать</span></button>
  ${eg}
  ${(i.for || []).length ? `<h4>Подходит для</h4><div class="mini">${i.for.map((s) => `<button class="chip" data-stack="${esc(s)}">${esc(stackById[s].name)}</button>`).join("")}</div>` : ""}
  ${inPb.length ? `<h4>Входит в порядки</h4><div class="mini">${inPb.map((p) => `<button class="chip" data-pb="${esc(p.id)}">${esc(p.name)}</button>`).join("")}</div>` : ""}
  ${inCmp.length ? `<h4>Сравнить с похожими</h4><div class="mini">${inCmp.map((g) => `<button class="chip" data-cmp="${esc(g.id)}">${esc(g.name)}</button>`).join("")}</div>` : ""}
  ${same.length ? `<h4>Рядом в разделе</h4><div class="mini">${same.map((x) => `<button class="chip" data-open="${esc(x.id)}">${esc(label(x))}</button>`).join("")}</div>` : ""}
  ${i.description ? `<details><summary>Оригинальное описание</summary><p>${esc(i.description)}</p></details>` : ""}
  <p style="margin-top:18px;font-size:12.5px;color:var(--faint)">Источник: ${esc(i.origin || "—")}</p>`;
}

function render() {
  $("#tabs").innerHTML = TABS.map(([id, n]) => `<button aria-pressed="${S.tab === id}" data-tab="${id}">${n}</button>`).join("");
  $("#search").classList.toggle("has-q", !!S.q);
  if ($("#q").value !== S.q) $("#q").value = S.q;
  $("#stacks").innerHTML = `<span class="chip-label">Делаю</span>` + D.stacks.map((s) => `<button class="chip" aria-pressed="${S.stack === s.id}" data-stack="${s.id}" title="${esc(s.hint)}">${esc(s.name)}</button>`).join("");
  const kindRow = S.tab === "catalog"
    ? KINDS.map(([id, n]) => `<button class="chip" aria-pressed="${S.kind === id}" data-kind="${id}">${n}</button>`).join("") + `<span class="chip-label" style="padding-left:8px">Раздел</span>` + D.categories.map((c) => `<button class="chip" aria-pressed="${S.cat === c.id}" data-cat="${c.id}">${esc(c.name)}</button>`).join("")
    : "";
  $("#kinds").innerHTML = kindRow;
  $("#kinds").style.display = kindRow ? "" : "none";
  $("#main").innerHTML = S.tab === "order" ? viewOrder() : S.tab === "pick" ? viewPick() : viewCatalog();
  $("#count").textContent = `${D.items.filter((i) => i.kind === "skill").length} скиллов · ${D.items.filter((i) => i.kind === "agent").length} агентов`;
  $("#foot").textContent = `Обновлено ${D.generated}. Каталог собирается из моих папок скриптом sync.py, поэтому новые скиллы и агенты появляются здесь сами.`;
  const it = byId[S.item];
  const sheet = $("#sheet");
  if (it) {
    $("#sheet-body").innerHTML = sheetHtml(it);
    $("#sheet-body").scrollTop = 0;
  }
  sheet.classList.toggle("on", !!it);
  $("#scrim").classList.toggle("on", !!it);
  document.body.style.overflow = it && matchMedia("(max-width: 640px)").matches ? "hidden" : "";
}

/* события */
document.addEventListener("click", (e) => {
  const t = e.target.closest("[data-open],[data-tab],[data-stack],[data-kind],[data-cat],[data-pb],[data-cmp],[data-copy],[data-reset]");
  if (!t) return;
  const d = t.dataset;
  if (d.copy !== undefined) {
    navigator.clipboard?.writeText(d.copy).then(() => { const s = t.querySelector("span"); s.textContent = "Скопировано"; setTimeout(() => (s.textContent = "Копировать"), 1200); });
  } else if (d.open) set({ item: d.open }, true);
  else if (d.tab) set({ tab: d.tab, item: "" });
  else if (d.stack !== undefined) set({ stack: S.stack === d.stack && t.closest(".chips") ? "" : d.stack, tab: S.tab, item: "" });
  else if (d.kind) set({ kind: d.kind });
  else if (d.cat) set({ cat: S.cat === d.cat ? "" : d.cat });
  else if (d.pb) { set({ tab: "order", item: "", q: "" }, true); setTimeout(() => document.getElementById("pb-" + d.pb)?.scrollIntoView({ behavior: "smooth", block: "start" }), 60); }
  else if (d.cmp) set({ tab: "pick", item: "" }, true);
  else if (d.reset !== undefined) set({ q: "", kind: "all", stack: "", cat: "" });
});
$("#q").addEventListener("input", (e) => { S.q = e.target.value; if (S.tab !== "catalog" && S.tab !== "order") S.tab = "catalog"; writeHash(false); render(); });
$("#clear").addEventListener("click", () => { set({ q: "" }); $("#q").focus(); });
const closeSheet = () => { if (S.item) { if (history.length > 1 && location.hash.includes("item=")) history.back(); else set({ item: "" }); } };
$("#scrim").addEventListener("click", closeSheet);
$("#close").addEventListener("click", closeSheet);
window.addEventListener("popstate", () => { readHash(); render(); });
window.addEventListener("hashchange", () => { const h = location.hash; const cur = "#" + new URLSearchParams(Object.fromEntries(Object.entries(S).filter(([k, v]) => v && !(k === "tab" && v === "catalog") && !(k === "kind" && v === "all")))).toString(); if (h !== cur && !(h === "" && cur === "#")) { readHash(); render(); } });
window.addEventListener("keydown", (e) => {
  const typing = /input|textarea/i.test(document.activeElement.tagName);
  if ((e.key === "/" && !typing) || ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k")) { e.preventDefault(); $("#q").focus(); $("#q").select(); }
  else if (e.key === "Escape") { if (S.item) closeSheet(); else if (S.q) set({ q: "" }); else document.activeElement.blur(); }
});

/* свайп вниз закрывает шторку на телефоне */
(() => {
  const sheet = $("#sheet"), grip = $("#grip");
  let y0 = 0, dy = 0, t0 = 0, on = false;
  grip.addEventListener("pointerdown", (e) => { on = true; y0 = e.clientY; t0 = e.timeStamp; dy = 0; grip.setPointerCapture(e.pointerId); sheet.classList.add("drag"); });
  grip.addEventListener("pointermove", (e) => { if (!on) return; dy = Math.max(0, e.clientY - y0); sheet.style.transform = `translateY(${dy}px)`; });
  const end = (e) => {
    if (!on) return; on = false; sheet.classList.remove("drag");
    const v = dy / Math.max(1, e.timeStamp - t0);
    sheet.style.transform = "";
    if (dy > 110 || v > 0.6) closeSheet();
  };
  grip.addEventListener("pointerup", end);
  grip.addEventListener("pointercancel", end);
})();

readHash();
render();
</script>
</body>
</html>
